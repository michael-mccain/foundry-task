metadata:
  name: "Robot Arm Mapping"
  source_ext: "csv"

# Controlled vocabularies
cvs:
  - type: "robo-ont:Unit"
    uri: "robo-r:unit"
    instances:
      [
        "grams",
        "kilograms",
        "pounds",
        "milimeters",
        "meters",
        "newtons",
        "celsius",
        "fahrenheit",
        "degrees",
        "degreesOfFreedom",
      ]

  - type: "robo-ont:SpecificationKind"
    uri: "robo-r:specificationKind"
    instances:
      [
        "temperature",
        "weight",
        "force",
        "degreesOfFreedom",
        "angle",
        "operatingRange",
      ]

  - type: "robo-ont:Specification"
    uri: "robo-r:specification"
    instances:
      [
        "workingRadius",
        "repeatedPositioningAccuracy",
        "payload",
        "degreesOfFreedom",
        "formFitGrip",
        "gripForce",
        "operatingTemperature",
        "stroke",
        "frictionGrip",
      ]

# For each row, create a Robot with specified URI.
root:
  type: ["robo-ont:SpatialThing", "robo-ont:Agent"]
  uri: "robo-r:agent"
  varids: ["Serial", "Type", "Robot"]
  connections:
    - p: "robo-ont:hasName"
      inv: "robo-ont:isNameOf"
      o:
        type: "robo-ont:Name"
        uri: "robo-r:name"
        varids: ["Serial", "Type", "Robot"]
        connections:
          - p: "robo-ont:nameAsText"
            o:
              datatype: "xsd:string"
              val_source: "Robot"

    # Serial
    - p: "robo-ont:hasSerial"
      inv: "robo-ont:isSerialOf"
      o:
        type: "robo-ont:Serial"
        uri: "robo-r:serial"
        varids: ["Serial", "Type", "Robot"]
        connections:
          - p: "robo-ont:serialAsText"
            o:
              datatype: "xsd:string"
              val_source: "Serial"

    # Category
    - p: "robo-ont:belongsToCategory"
      inv: "robo-ont:isCategoryOf"
      o:
        type: ["robo-ont:Category", "robo-ont:AgentCategory"]
        uri: "robo-r:agentCategory"
        connections:
          - p: "robo-ont:hasCategorizationType"
            o:
              datatype: "rdfs:Literal"
              val_source: "Type"

    # Capability - Motion - Reach
    - p: "robo-ont:hasCapability"
      inv: "robo-ont:capabilityOf"
      o:
        type: ["robo-ont:Capability", "robo-ont:MotionBased", "robo-ont:Reach"]
        uri: "robo-r:reach"
        varids: ["Serial", "Type", "Robot"]
        connections:
          - p: "robo-ont:hasSpec"
            inv: "robo-ont:isSpecOf"
            o:
              type: "robo-ont:Specification"
              uri: "robo-r:specification"
              varids: ["Serial", "Type", "Robot"]
              appellation: "workingRadius"
              connections:
                - p: "robo-ont:hasSpecKind"
                  inv: "robo-ont:specKindOf"
                  o:
                    type: "robo-ont:SpecificationKind"
                    uri: "robo-r:specificationKind"
                    varids: ["Serial", "Type", "Robot"]
                    appellation: "operatingRange"
                - p: "robo-ont:hasThreshold"
                  o:
                    type: ["robo-ont:Threshold", "robo-ont:UpperThreshold"]
                    uri: "robo-r:upperThreshold"
                    varids: ["Serial", "Type", "Robot", "Operating Range (mm)"]
                    connections:
                      - p: "robo-ont:hasValue"
                        o:
                          datatype: "xsd:double"
                          val_source: "Operating Range (mm)"
                      - p: "robo-ont:hasUnit"
                        o: "robo-r:hasUnit.milimeters"

    # Capability - MotionBased - Push
    - p: "robo-ont:hasCapability"
      inv: "robo-ont:capabilityOf"
      o:
        type: ["robo-ont:Capability", "robo-ont:MotionBased", "robo-ont:Push"]
        uri: "robo-r:push"
        varids: ["Serial", "Type", "Robot"]
        connections:
          - p: "robo-ont:hasSpec"
            inv: "robo-ont:isSpecOf"
            o:
              type: "robo-ont:Specification"
              uri: "robo-r:specification"
              varids: ["Serial", "Type", "Robot"]
              appellation: "payload"
              connections:
                - p: "robo-ont:hasSpecKind"
                  inv: "robo-ont:specKindOf"
                  o:
                    type: "robo-ont:SpecificationKind"
                    uri: "robo-r:specificationKind"
                    varids: ["Serial", "Type", "Robot"]
                    appellation: "weight"
                - p: "robo-ont:hasThreshold"
                  o:
                    type: ["robo-ont:Threshold", "robo-ont:UpperThreshold"]
                    uri: "robo-r:upperThreshold"
                    varids: ["Serial", "Type", "Robot", "Max Payload (Grams)"]
                    connections:
                      - p: "robo-ont:hasValue"
                        o:
                          datatype: "xsd:double"
                          val_source: "Max Payload (Grams)"
                      - p: "robo-ont:hasUnit"
                        o: "robo-r:hasUnit.grams"

    # Capability - MotionBased - Pull
    - p: "robo-ont:hasCapability"
      inv: "robo-ont:capabilityOf"
      o:
        type: ["robo-ont:Capability", "robo-ont:MotionBased", "robo-ont:Pull"]
        uri: "robo-r:pull"
        varids: ["Serial", "Type", "Robot"]
        connections:
          - p: "robo-ont:hasSpec"
            inv: "robo-ont:isSpecOf"
            o:
              type: "robo-ont:Specification"
              uri: "robo-r:specification"
              varids: ["Serial", "Type", "Robot"]
              appellation: "payload"
              connections:
                - p: "robo-ont:hasSpecKind"
                  inv: "robo-ont:specKindOf"
                  o:
                    type: "robo-ont:SpecificationKind"
                    uri: "robo-r:specificationKind"
                    varids: ["Serial", "Type", "Robot"]
                    appellation: "weight"
                - p: "robo-ont:hasThreshold"
                  o:
                    type: ["robo-ont:Threshold", "robo-ont:UpperThreshold"]
                    uri: "robo-r:upperThreshold"
                    varids: ["Serial", "Type", "Robot", "Max Payload (Grams)"]
                    connections:
                      - p: "robo-ont:hasValue"
                        o:
                          datatype: "xsd:double"
                          val_source: "Max Payload (Grams)"
                      - p: "robo-ont:hasUnit"
                        o: "robo-r:hasUnit.grams"

    # Capability - ResistanceBased - ThermalResistant - Max
    - p: "robo-ont:hasCapability"
      inv: "robo-ont:capabilityOf"
      o:
        type:
          [
            "robo-ont:Capability",
            "robo-ont:MotionBased",
            "robo-ont:ThermalResistant",
          ]
        uri: "robo-r:thermalResistant"
        varids: ["Serial", "Type", "Robot"]
        connections:
          - p: "robo-ont:hasSpec"
            inv: "robo-ont:isSpecOf"
            o:
              type: "robo-ont:Specification"
              uri: "robo-r:specification"
              varids: ["Serial", "Type", "Robot"]
              appellation: "operatingTemperature"
              connections:
                - p: "robo-ont:hasSpecKind"
                  inv: "robo-ont:specKindOf"
                  o:
                    type: "robo-ont:SpecificationKind"
                    uri: "robo-r:specificationKind"
                    varids: ["Serial", "Type", "Robot"]
                    appellation: "temperature"
                - p: "robo-ont:hasThreshold"
                  o:
                    type: ["robo-ont:Threshold", "robo-ont:UpperThreshold"]
                    uri: "robo-r:upperThreshold"
                    varids:
                      [
                        "Serial",
                        "Type",
                        "Robot",
                        "Max Operating Temperature (Celsius)",
                      ]
                    connections:
                      - p: "robo-ont:hasValue"
                        o:
                          datatype: "xsd:double"
                          val_source: "Max Operating Temperature (Celsius)"
                      - p: "robo-ont:hasUnit"
                        o: "robo-r:hasUnit.celsius"

    # Capability - ResistanceBased - ThermalResistant - Max
    - p: "robo-ont:hasCapability"
      inv: "robo-ont:capabilityOf"
      o:
        type:
          [
            "robo-ont:Capability",
            "robo-ont:MotionBased",
            "robo-ont:ThermalResistant",
          ]
        uri: "robo-r:thermalResistant"
        varids: ["Serial", "Type", "Robot"]
        connections:
          - p: "robo-ont:hasSpec"
            inv: "robo-ont:isSpecOf"
            o:
              type: "robo-ont:Specification"
              uri: "robo-r:specification"
              varids: ["Serial", "Type", "Robot"]
              appellation: "operatingTemperature"
              connections:
                - p: "robo-ont:hasSpecKind"
                  inv: "robo-ont:specKindOf"
                  o:
                    type: "robo-ont:SpecificationKind"
                    uri: "robo-r:specificationKind"
                    varids: ["Serial", "Type", "Robot"]
                    appellation: "temperature"
                - p: "robo-ont:hasThreshold"
                  o:
                    type: ["robo-ont:Threshold", "robo-ont:lowerThreshold"]
                    uri: "robo-r:lowerThreshold"
                    varids:
                      [
                        "Serial",
                        "Type",
                        "Robot",
                        "Min Operating Temperature (Celsius)",
                      ]
                    connections:
                      - p: "robo-ont:hasValue"
                        o:
                          datatype: "xsd:double"
                          val_source: "Min Operating Temperature (Celsius)"
                      - p: "robo-ont:hasUnit"
                        o: "robo-r:hasUnit.celsius"
